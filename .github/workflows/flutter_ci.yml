name: Flutter CI

on:
  push:
    branches:
      - main
      - develop
      - 'Sprint-*'
  pull_request:
    branches:
      - main
      - develop
      - 'Sprint-*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Code (Lint)
        run: flutter analyze

      - name: Run Tests
        run: flutter test

      - name: Build APK
        run: flutter build apk --release
